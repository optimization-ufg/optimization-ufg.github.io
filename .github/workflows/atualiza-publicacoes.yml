# Toda segunda-feira, procura no OpenAlex artigos novos dos professores (pelo ORCID) e completa
# os "to appear" que já saíram. O resultado vai direto para o site, e um aviso (issue) lista o
# que mudou. Também pode ser rodado à mão em Actions → Atualizar publicações → Run workflow.
name: Atualizar publicações

on:
  schedule:
    - cron: "0 9 * * 1"   # segundas, 6h em Brasília
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write

concurrency: atualiza-publicacoes

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Buscar no OpenAlex
        id: busca
        run: ruby scripts/atualiza-publicacoes.rb

      - name: Publicar e avisar
        if: steps.busca.outputs.mudou == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml
          git commit -m "Publicações atualizadas pelo OpenAlex (${{ steps.busca.outputs.novos }} novas, ${{ steps.busca.outputs.atualizados }} to appear completadas)"
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
          gh issue create \
            --title "Publicações atualizadas: ${{ steps.busca.outputs.novos }} novas, ${{ steps.busca.outputs.atualizados }} completadas" \
            --body-file aviso.md
