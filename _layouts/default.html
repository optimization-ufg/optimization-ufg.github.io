<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="name">{{ site.title }}</span>
      <span class="sub">{{ site.subtitle }}</span>
    </a>
  </div>
</header>
<nav class="menu">
  <div class="wrap">
    <a href="{{ '/' | relative_url }}"{% if page.url == "/" or page.url == "/index.html" %} class="current"{% endif %}>Home</a>
    <a href="{{ '/members/' | relative_url }}"{% if page.url contains "/members" %} class="current"{% endif %}>Members</a>
    <a href="{{ '/publications/' | relative_url }}"{% if page.url contains "/publications" %} class="current"{% endif %}>Publications</a>
    <a href="{{ '/seminars/' | relative_url }}"{% if page.url contains "/seminars" %} class="current"{% endif %}>Seminars</a>
    <a href="{{ '/links/' | relative_url }}"{% if page.url contains "/links" %} class="current"{% endif %}>Links</a>
  </div>
</nav>
<main class="wrap">
{% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
{{ content }}
</main>
<footer class="footer">
  <div class="wrap">Continuous Optimization Group · IME, Universidade Federal de Goiás · Campus Samambaia, 74690-900 Goiânia, GO, Brazil</div>
</footer>
</body>
</html>
